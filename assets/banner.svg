<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="aws-job-tracker: a job search tracker that logs itself from Gmail, built entirely in Terraform">
  <defs>
    <radialGradient id="g1" cx="16%" cy="-10%" r="75%"><stop offset="0" stop-color="#a78bfa" stop-opacity=".32"/><stop offset=".55" stop-color="#a78bfa" stop-opacity=".05"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="110%" r="55%"><stop offset="0" stop-color="#6d28d9" stop-opacity=".4"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9e2ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#a78bfa" flood-opacity=".2"/></filter>
    <style>
      .mono{font-family:ui-monospace,'SF Mono',Consolas,Menlo,monospace}
      .sans{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .pulse{animation:p 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes p{0%{opacity:.9;transform:scale(1)}70%{opacity:0;transform:scale(3.2)}100%{opacity:0}}
      .slide{animation:s 4s ease-in-out infinite}
      @keyframes s{0%,70%{opacity:1;transform:translateY(0)}82%{opacity:0;transform:translateY(-10px)}90%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
      @media (prefers-reduced-motion:reduce){.pulse,.slide{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="380" rx="18" fill="#08070d"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#g1)"/>
  <rect width="1280" height="380" rx="18" fill="url(#g2)"/>
  <rect x=".5" y=".5" width="1279" height="379" rx="17.5" fill="none" stroke="#a78bfa" stroke-opacity=".3"/>

  <g transform="translate(64 0)">
    <g transform="translate(0 72)">
      <circle cx="6" cy="-5" r="5" fill="#a78bfa" class="pulse"/><circle cx="6" cy="-5" r="5" fill="#a78bfa"/>
      <text x="22" y="0" class="mono" font-size="15" letter-spacing="3" fill="#c4b5fd">PROJECT 04 · TERRAFORM · SERVERLESS</text>
    </g>
    <text x="-3" y="150" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#t)">aws-job-tracker</text>
    <text x="0" y="196" class="sans" font-size="24" fill="#cfc8e6">A job search tracker that logs itself from Gmail —</text>
    <text x="0" y="228" class="sans" font-size="24" fill="#cfc8e6">32 resources,
      <tspan fill="#a78bfa" font-weight="700">one terraform apply.</tspan></text>
    <g transform="translate(0 280)" class="mono" font-size="14">
      <g><rect width="108" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="54" y="22" text-anchor="middle" fill="#ddd2ff">Terraform</text></g>
      <g transform="translate(120 0)"><rect width="92" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="46" y="22" text-anchor="middle" fill="#ddd2ff">Lambda</text></g>
      <g transform="translate(224 0)"><rect width="108" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="54" y="22" text-anchor="middle" fill="#ddd2ff">DynamoDB</text></g>
      <g transform="translate(344 0)"><rect width="92" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="46" y="22" text-anchor="middle" fill="#ddd2ff">Bedrock</text></g>
      <g transform="translate(448 0)"><rect width="168" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="84" y="22" text-anchor="middle" fill="#ddd2ff">Gmail + Apps Script</text></g>
    </g>
  </g>

  <g transform="translate(880 46)" filter="url(#sh)">
    <rect width="340" height="288" rx="20" fill="#100e18" stroke="#2f2946"/>
    <text x="24" y="38" class="mono" font-size="11" letter-spacing="2" fill="#a78bfa">APPLICATIONS</text>
    <g class="slide">
      <rect x="18" y="58" width="304" height="58" rx="11" fill="#1a1530" stroke="#a78bfa" stroke-opacity=".6"/>
      <rect x="18" y="58" width="4" height="58" rx="2" fill="#a78bfa"/>
      <text x="36" y="82" class="sans" font-size="15" font-weight="700" fill="#f3efff">PwC</text>
      <text x="36" y="102" class="mono" font-size="11" fill="#9d95b8">from Gmail · just now</text>
      <rect x="236" y="74" width="72" height="26" rx="13" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/>
      <text x="272" y="91" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c4b5fd">applied</text>
    </g>
    <g transform="translate(0 70)">
      <rect x="18" y="58" width="304" height="58" rx="11" fill="#14111f" stroke="#2a2540"/>
      <rect x="18" y="58" width="4" height="58" rx="2" fill="#3ee07f"/>
      <text x="36" y="82" class="sans" font-size="15" font-weight="700" fill="#f3efff">AWS</text>
      <text x="36" y="102" class="mono" font-size="11" fill="#9d95b8">recruiter call booked</text>
      <rect x="226" y="74" width="82" height="26" rx="13" fill="#3ee07f" fill-opacity=".12" stroke="#3ee07f"/>
      <text x="267" y="91" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6ff0ad">interview</text>
    </g>
    <g transform="translate(0 140)">
      <rect x="18" y="58" width="304" height="58" rx="11" fill="#14111f" stroke="#2a2540"/>
      <rect x="18" y="58" width="4" height="58" rx="2" fill="#f7b955"/>
      <text x="36" y="82" class="sans" font-size="15" font-weight="700" fill="#f3efff">Capital One</text>
      <text x="36" y="102" class="mono" font-size="11" fill="#f7b955">9 days quiet · follow up</text>
      <rect x="236" y="74" width="72" height="26" rx="13" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/>
      <text x="272" y="91" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c4b5fd">applied</text>
    </g>
  </g>
</svg>
